<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃至祥 — Portfolio | 作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #1a8a6e; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
</div>

<div class="slide-deck" id="deck"></div>

<div class="nav-dots" id="navDots"></div>
<div class="nav-arrows nav-prev"><button class="nav-arrow-btn" onclick="prevSlide()" title="Previous">&#x2190;</button></div>
<div class="nav-arrows nav-next"><button class="nav-arrow-btn" onclick="nextSlide()" title="Next">&#x2192;</button></div>
<div class="key-hint" id="keyHint"><span class="key-badge">&larr;</span> <span class="key-badge">&rarr;</span> Navigate</div>

<script src="js/script.js"></script>
</body>
</html>
